# Verifies that a published tag installs from the public Git URL in a clean consumer project.
name: Remote Consumer Verification

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Exact released version tag to resolve (e.g. 0.1.0)"
        required: true
        default: "0.1.0"

permissions:
  contents: read

jobs:
  remote-consumer:
    name: Resolve exact tag from GitHub & use SwiftUI / UIKit / AppKit APIs
    runs-on: macos-15-intel
    steps:
      - name: Checkout consumer fixture
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/consumer

      - name: Resolve, build and run remote consumer
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          bash .github/consumer/run-consumer.sh remote \
            "https://github.com/infitusofficial/slatico-swift.git" \
            "${VERSION}"
